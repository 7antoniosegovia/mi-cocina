<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Cocina">
  <title>Mi Cocina</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><p class="eyebrow">MI COCINA</p><h1 id="pageTitle">Compra</h1></div>
    <button class="icon-button" id="addButton" aria-label="Añadir">＋</button>
  </header>
  <main id="content"></main>
  <nav class="tabbar">
    <button class="tab active" data-tab="shopping"><span>🛒</span><small>Compra</small></button>
    <button class="tab" data-tab="recipes"><span>🍳</span><small>Recetas</small></button>
    <button class="tab" data-tab="settings"><span>⚙️</span><small>Ajustes</small></button>
  </nav>
</div>
<div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div><div id="sheetContent"></div>
</section>
<script src="app.js"></script>
</body>
</html>
